<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Greystar Telemetry</title>
<meta name="theme-color" content="#070912">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="system.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: #070912; }
  body { display: flex; min-height: 100svh; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box;
    background: radial-gradient(60% 50% at 50% 40%, #121a12 0%, #070912 70%); color: #f9fafb; font-family: "Urbanist", system-ui, sans-serif; }
  .lg { display: flex; flex-direction: column; align-items: center; gap: 32px; width: 100%; max-width: 420px; }
  .lg__logo { width: min(360px, 86vw); height: auto; }
  .lg__label { margin-top: -20px; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #9daaa9; }
  .lg__card { box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 16px; padding: 28px; border-radius: 32px;
    background: rgba(249, 250, 251, 0.04); box-shadow: inset 0 0 0 1px rgba(249, 250, 251, 0.1), 0 24px 60px rgba(0, 0, 0, 0.45); }
  .lg__title { margin: 0; font-size: 28px; line-height: 34px; font-weight: 300; letter-spacing: -0.01em; }
  .lg__sub { margin: -8px 0 0; font-size: 14px; line-height: 20px; color: #9daaa9; }
  .lg__btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 22px; border: 0; border-radius: 999px;
    font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; }
  .lg__btn--plex { background: #b8f265; color: #0f1720; }
  .lg__btn--plex:hover { background: #c6f77f; }
  .lg__btn--dark { background: #f9fafb; color: #0f1720; }
  .lg__btn--quiet { height: 40px; padding: 0 12px; background: transparent; color: #9daaa9; font-weight: 500; }
  .lg__btn:disabled { opacity: 0.55; cursor: default; }
  .lg__btn:focus-visible, .lg__input:focus-visible, .lg__link:focus-visible { outline: 2px solid #b8f265; outline-offset: 3px; }
  .lg__or { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #9daaa9; }
  .lg__or::before, .lg__or::after { content: ""; flex: 1; height: 1px; background: rgba(249, 250, 251, 0.12); }
  .lg__form { display: flex; flex-direction: column; gap: 12px; }
  .lg__form[hidden] { display: none; }
  .lg__field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500; }
  .lg__input { box-sizing: border-box; height: 46px; padding: 0 16px; border: 0; border-radius: 16px; background: rgba(249, 250, 251, 0.07);
    color: #f9fafb; box-shadow: inset 0 0 0 1px rgba(249, 250, 251, 0.16); font-family: inherit; font-size: 15px; }
  .lg__msg { margin: 0; padding: 12px 14px; border-radius: 16px; font-size: 14px; line-height: 20px; }
  .lg__msg--error { background: rgba(255, 138, 147, 0.1); color: #ffb3b9; box-shadow: inset 0 0 0 1px rgba(255, 138, 147, 0.45); }
  .lg__msg--wait { background: rgba(184, 242, 101, 0.1); color: #e3f8c4; box-shadow: inset 0 0 0 1px rgba(184, 242, 101, 0.35); }
  .lg__msg[hidden] { display: none; }
  .lg__link { color: #b8f265; }
  .lg__dots { display: inline-flex; gap: 6px; vertical-align: middle; margin-right: 8px; }
  .lg__dots i { width: 7px; height: 7px; border-radius: 50%; background: #b8f265; animation: lg-pulse 1.2s infinite ease-in-out; }
  .lg__dots i:nth-child(2) { animation-delay: 0.15s; }
  .lg__dots i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes lg-pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .lg__dots i { animation: none; } }
  .lg__foot { font-size: 12px; color: #9daaa9; text-align: center; max-width: 340px; line-height: 18px; }
  @media (max-width: 420px) { .lg__card { padding: 22px; border-radius: 28px; } }
</style>
</head>
<body>
<main class="lg">
  <img class="lg__logo" src="assets/logo-glow.png" alt="Greystar Networks" width="1000" height="250">
  <div class="lg__label">Telemetry</div>
  <section class="lg__card" aria-labelledby="lg-title">
    <h1 class="lg__title" id="lg-title">Sign in</h1>
    <p class="lg__sub">Use the Plex account you watch Greystar servers with.</p>
    <button type="button" class="lg__btn lg__btn--plex" id="plex">Sign in with Plex</button>
    <p class="lg__msg lg__msg--wait" id="wait" role="status" hidden></p>
    <p class="lg__msg lg__msg--error" id="err" role="alert" hidden></p>
    <div class="lg__or">or</div>
    <button type="button" class="lg__btn lg__btn--quiet" id="show-local" aria-expanded="false" aria-controls="local">Administrator sign-in</button>
    <form class="lg__form" id="local" hidden>
      <label class="lg__field">Username<input class="lg__input" id="u" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
      <label class="lg__field">Password<input class="lg__input" id="p" name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="lg__btn lg__btn--dark" id="local-go">Sign in</button>
    </form>
  </section>
  <p class="lg__foot">Plex shows Greystar Telemetry as asking to sign in. The dashboard only reads your name and email; it never sees your Plex password.</p>
</main>
<script src="login.js"></script>
</body>
</html>
