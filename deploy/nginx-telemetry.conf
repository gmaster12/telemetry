# Greystar Telemetry behind nginx, for streaming.greystarnetworks.com
#
#   sudo cp deploy/nginx-telemetry.conf /etc/nginx/sites-available/streaming.greystarnetworks.com
#   sudo ln -s /etc/nginx/sites-available/streaming.greystarnetworks.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d streaming.greystarnetworks.com --redirect
#
# certbot adds the HTTPS (443) block, the certificate and the http -> https
# redirect to this file, and renews the certificate automatically.
server {
    listen 80;
    listen [::]:80;
    server_name streaming.greystarnetworks.com;

    # The app enforces its own sign-in (Plex accounts and admin logins).
    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
