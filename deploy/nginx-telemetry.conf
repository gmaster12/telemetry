# /etc/nginx/sites-available/telemetry  (then: ln -s ../sites-available/telemetry /etc/nginx/sites-enabled/)
# Get a certificate first: sudo certbot --nginx -d telemetry.greystarnetworks.com
server {
    listen 80;
    server_name telemetry.greystarnetworks.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name telemetry.greystarnetworks.com;

    ssl_certificate     /etc/letsencrypt/live/telemetry.greystarnetworks.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telemetry.greystarnetworks.com/privkey.pem;

    # The app enforces its own sign-in (Plex accounts and admin logins).
    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
